name: Test basic latexmk usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal LaTeX document
        run: |
          mkdir -p "$GITHUB_WORKSPACE/latex-test"
          cat > "$GITHUB_WORKSPACE/latex-test/main.tex" << 'EOF'
          \documentclass{article}
          \begin{document}
          Hello, World!
          \end{document}
          EOF

      - id: action
        uses: .
        with:
          path: latex-test
          opts: '-pdf -interaction=nonstopmode main.tex'

      - name: Assert PDF was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/latex-test/main.pdf" ]; then
            echo "FAIL: expected main.pdf to be generated"
            exit 1
          fi
          echo "PASS: main.pdf was generated"
