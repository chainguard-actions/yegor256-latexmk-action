name: Test latexmk with opts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create LaTeX document
        run: |
          mkdir -p "$GITHUB_WORKSPACE/latex-opts"
          cat > "$GITHUB_WORKSPACE/latex-opts/main.tex" << 'EOF'
          \documentclass{article}
          \begin{document}
          Options test.
          \end{document}
          EOF
      - id: action
        uses: .
        with:
          path: latex-opts
          opts: '-pdf -interaction=nonstopmode -silent'
      - name: Assert PDF was generated
        run: |
          ls -la "$GITHUB_WORKSPACE/latex-opts/"
          if [ ! -f "$GITHUB_WORKSPACE/latex-opts/main.pdf" ]; then
            echo "FAIL: expected main.pdf to be generated with opts"
            exit 1
          fi
          echo "PASS: main.pdf was generated with opts"
