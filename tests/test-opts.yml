name: Test latexmk opts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run latexmk-action with version flag via opts
        id: action
        uses: .
        with:
          path: tests/fixtures/latex
          cmd: latexmk
          opts: '-version'
      - name: Assert action completed successfully
        run: |
          echo "PASS: latexmk -version ran successfully via opts input"
