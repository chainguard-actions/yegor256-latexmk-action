name: Test latexmk with custom opts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal LaTeX project with opts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/latex-opts"
          cat > "$GITHUB_WORKSPACE/latex-opts/main.tex" << 'EOF'
          \documentclass{article}
          \begin{document}
          Testing opts!
          \end{document}
          EOF
      - id: action
        uses: .
        with:
          path: latex-opts
          cmd: latexmk
          opts: '-pdf -interaction=nonstopmode -quiet main.tex'
      - name: Assert PDF was created with opts
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/latex-opts/main.pdf" ]; then
            echo "FAIL: expected main.pdf to be created in latex-opts/"
            ls -la "$GITHUB_WORKSPACE/latex-opts/" || true
            exit 1
          fi
          echo "PASS: main.pdf was created with custom opts"
