---
# yamllint disable rule:line-length
name: test
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./
        with:
          cmd: latexmk
          path: .
          opts: -pdf test
          debs: fonts-noto-core fonts-noto-extra
          packages: |
            ffcode fvextra catchfile xstring framed environ upquote listings
